<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Client per il tuo server multimediale Mycelium.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pileus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="theme-color" content="#0D0D1A">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pileus</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0D0D1A; }
    /* Boot placeholder — shown until Flutter paints its first frame. */
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; background: #0D0D1A;
      transition: opacity .3s ease; z-index: 9999;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    #boot .ring {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(124,106,247,.25);
      border-top-color: #7C6AF7;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot"><div class="ring"></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) { b.classList.add('hide'); setTimeout(function(){ b.remove(); }, 350); }
    });
  </script>
  <script>
    // TV remote key bridge (Tizen/webOS — see docs/TIZEN_WEBOS.md).
    // Samsung/LG TV remotes report Back and the
    // dedicated media-transport buttons as legacy numeric `keyCode`s with
    // no standard `key` string alongside them — neither a plain browser
    // nor Flutter's own web key-mapping table knows what to do with those,
    // so every existing D-pad/Escape/media-key handler in the app (all
    // keyed off LogicalKeyboardKey, see back_dispatch.dart and
    // playback_screen/view.dart) would otherwise never fire for them.
    //
    // This intercepts the raw event and replaces it with a synthetic one
    // carrying a standard `key` Flutter's mapping table already understands
    // (Escape for Back, the standard Media* keys for transport) — must be
    // registered here, before flutter_bootstrap.js loads below, so it's
    // first in the window's capture-phase listener order and can reliably
    // run before Flutter's own listener sees the original raw event.
    // Harmless everywhere else: none of these keyCodes occur on a real
    // computer keyboard, so this is dead code outside an actual Tizen/webOS
    // remote — NOT verified on real hardware yet, only against each
    // platform's published remote-control keyCode reference; confirm on a
    // Tizen Studio / webOS TV Simulator session before relying on it.
    (function () {
      var REMOTE_KEYCODE_MAP = {
        // Back → GoBack, the key Android TV remotes send: main.dart gives it
        // Android's "key path + router pop" pair (keyboard Escape doesn't).
        10009: 'GoBack', // Tizen: Back
        461: 'GoBack',   // webOS: Back
        415: 'MediaPlay',
        19: 'MediaPause',
        10252: 'MediaPlayPause', // Tizen: Play/Pause
        413: 'MediaStop',
        412: 'MediaRewind',      // Tizen: Rewind
        417: 'MediaFastForward'  // Tizen: Fast-forward
      };
      // keyup must be bridged too: with only a synthetic keydown, Flutter
      // keeps the mapped key "pressed" forever and its key state drifts.
      function bridge(e) {
        var mappedKey = REMOTE_KEYCODE_MAP[e.keyCode];
        if (!mappedKey) return;
        e.stopImmediatePropagation();
        e.preventDefault();
        window.dispatchEvent(new KeyboardEvent(e.type, {
          key: mappedKey,
          code: mappedKey === 'GoBack' ? 'BrowserBack' : mappedKey,
          repeat: e.repeat,
          bubbles: true,
          cancelable: true
        }));
      }
      window.addEventListener('keydown', bridge, true);
      window.addEventListener('keyup', bridge, true);
      // Tizen only delivers the media keys to an app that registered them
      // (Back and the arrows come through regardless).
      try {
        if (window.tizen && tizen.tvinputdevice) {
          ['MediaPlay', 'MediaPause', 'MediaPlayPause', 'MediaStop',
           'MediaRewind', 'MediaFastForward'].forEach(function (k) {
            try { tizen.tvinputdevice.registerKey(k); } catch (_) {}
          });
        }
      } catch (_) {}

      // Tizen answers "maybe" for HLS, and media_kit's web player
      // (_isHLS in media_kit/lib/src/player/web/player/real.dart) takes any
      // non-empty answer as "play it natively" and skips hls.js. The TV's
      // own HLS engine then fails a VOD master playlist with a separate
      // audio rendition + AES-128 segments (MM_ERROR_PLAYER_CODEC_NOT_FOUND:
      // black frame, position -00:01), while hls.js over MSE plays it.
      // Saying "" for the HLS MIME types sends every stream to hls.js.
      try {
        if (/Tizen/.test(navigator.userAgent)) {
          var nativeCanPlay = HTMLMediaElement.prototype.canPlayType;
          HTMLMediaElement.prototype.canPlayType = function (type) {
            if (/mpegurl/i.test(String(type))) return '';
            return nativeCanPlay.call(this, type);
          };
        }
      } catch (_) {}

      // Called by lib/core/utils/app_exit_web.dart — SystemNavigator.pop()
      // is a no-op on web. A plain browser tab ignores window.close().
      window.pileusExitApp = function () {
        try {
          if (window.tizen && tizen.application) {
            tizen.application.getCurrentApplication().exit();
            return;
          }
        } catch (_) {}
        window.close(); // webOS: terminates the app
      };

      // LAN IPv4 addresses of this TV, for the discovery screen's /24 sweep
      // (lib/core/utils/web_local_ip_web.dart) — a page has no
      // NetworkInterface.list. Resolves [] rather than failing.
      window.pileusLocalIps = function () {
        var PRIVATE = /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/;
        var found = [];
        function add(ip) {
          if (ip && PRIVATE.test(ip) && found.indexOf(ip) < 0) found.push(ip);
        }
        function viaLuna() {
          return new Promise(function (resolve) {
            if (typeof PalmServiceBridge === 'undefined') return resolve();
            try {
              var bridge = new PalmServiceBridge();
              bridge.onservicecallback = function (msg) {
                try {
                  var r = JSON.parse(msg);
                  if (r.wired) add(r.wired.ipAddress);
                  if (r.wifi) add(r.wifi.ipAddress);
                } catch (_) {}
                resolve();
              };
              bridge.call('luna://com.palm.connectionmanager/getStatus', '{}');
            } catch (_) { resolve(); }
          });
        }
        function viaTizen() {
          try {
            if (window.webapis && webapis.network && webapis.network.getIp) {
              add(webapis.network.getIp());
            }
          } catch (_) {}
          return Promise.resolve();
        }
        function viaWebRtc() {
          return new Promise(function (resolve) {
            if (typeof RTCPeerConnection === 'undefined') return resolve();
            try {
              var pc = new RTCPeerConnection({ iceServers: [] });
              pc.createDataChannel('');
              pc.onicecandidate = function (e) {
                if (!e.candidate) { pc.close(); return resolve(); }
                var m = /(\d+\.\d+\.\d+\.\d+)/.exec(e.candidate.candidate);
                if (m) add(m[1]);
              };
              pc.createOffer().then(function (o) { return pc.setLocalDescription(o); })
                .catch(function () { resolve(); });
            } catch (_) { resolve(); }
          });
        }
        function withTimeout(p, ms) {
          return Promise.race([p, new Promise(function (r) { setTimeout(r, ms); })]);
        }
        return withTimeout(viaLuna(), 1500)
          .then(viaTizen)
          .then(function () {
            return found.length ? null : withTimeout(viaWebRtc(), 1500);
          })
          .then(function () { return found; });
      };
    })();
  </script>
  <!-- Bundled locally (not a CDN) so the PWA works offline and no external
       host has to be whitelisted in a deployment CSP. Chrome/Firefox need it
       to play HLS; Safari plays HLS natively and this stays dormant. -->
  <script src="hls.min.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
