# Pre-merge gate: static analysis + unit tests on every push and PR to the
# main lines. No native toolchain, no signing — just `flutter analyze` and
# `flutter test`. Build coverage for the release artifacts lives in
# release.yml / store.yml / linux.yml / web.yml.
#
# Same runner requirements as web.yml: a registered `docker` runner and a
# RELEASE_TOKEN secret (used only to clone the private repo).

name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  analyze-test:
    runs-on: docker
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    steps:
      - name: Checkout (git, no JS action)
        run: |
          set -eu
          server="${{ github.server_url }}"
          repo="${{ github.repository }}"
          sha="${{ github.sha }}"
          auth_url="https://${{ github.actor }}:${{ secrets.RELEASE_TOKEN }}@${server#https://}/${repo}.git"
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$auth_url"
          git fetch -q --depth 1 origin "$sha"
          git checkout -q "$sha"
          git remote set-url origin "${server}/${repo}.git"

      - name: Flutter deps
        run: |
          flutter --version
          flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded
