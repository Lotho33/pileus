syntax = "proto3";

package mycelium;

option go_package = "github.com/Lotho33/stipes-sdk/sdk/gen;gen";

// ─────────────────────────────────────────────────────────────────────────────
// MediaPipeline — Pileus player → Core
// Delegates internally to Lua plugin system.
//
// Type hierarchy:
//   CatalogItem  — lightweight tile for catalog/search/browse responses
//   EpisodeInfo  — rich episode object returned when browsing a season
//   SeasonInfo   — season metadata, lives inside SeriesDetails
//   *Details     — typed rich metadata, returned only by GetDetails
// ─────────────────────────────────────────────────────────────────────────────

// CatalogItem is the lightweight tile object used in catalog/search/browse.
// Rich per-type metadata lives in DetailsResponse.details (oneof typed messages).
// Lua plugins must return JSON with these exact field names.
message CatalogItem {
  string id          = 1;
  string title       = 2;
  // media_type: "movie"|"series"|"episode"|"live"|"music"|"podcast"|"video"
  string media_type  = 3;
  string poster_url  = 4;
  int32  year        = 5;
  double rating      = 6;
  bool   is_dir      = 7;   // true → browse; false → play/details
  string provider_id = 8;
  string show_id     = 9;   // for episodes: parent show ID
  string parent_id   = 10;  // for episodes: parent season directory_id
  int32  season_number  = 11;
  int32  episode_number = 12;
  // direct play without resolve step:
  string direct_stream_url = 13;
  bool   is_external       = 14;
  // escape hatch for plugin-specific edge cases — NOT for structured data:
  map<string, string> extra = 15;
  // logo_url: transparent PNG/SVG wordmark (from TMDB images.logos or Fanart.tv)
  string logo_url    = 16;
  // banner_url: wide landscape image (AniList bannerImage, TMDB backdrop for banner-mode)
  string banner_url  = 17;
}

// EpisodeInfo is the rich episode object returned when browsing a season.
// TMDB-first: all fields map 1:1 to TMDB episode response.
message EpisodeInfo {
  string id             = 1;
  string title          = 2;
  int32  episode_number = 3;
  int32  season_number  = 4;
  string thumbnail_url  = 5;   // TMDB still_path, 16:9
  string air_date       = 6;   // "2023-04-02"
  int32  duration       = 7;   // minutes
  double vote           = 8;   // 0.0–10.0
  string plot           = 9;
  string show_id        = 10;
  string parent_id      = 11;  // season directory_id
}

// SeasonInfo lives inside SeriesDetails.
message SeasonInfo {
  int32  number        = 1;
  string label         = 2;
  string directory_id  = 3;
  string poster_url    = 4;
  int32  year          = 5;
  int32  episode_count = 6;
  string overview      = 7;   // TMDB season overview
  string air_date      = 8;   // "YYYY-MM-DD"
}

// ─── Requests ─────────────────────────────────────────────────────────────────

message CatalogRequest {
  string plugin_id  = 1;
  string catalog_id = 2;
  int32  page       = 3;
}
message CatalogResponse {
  repeated CatalogItem items    = 1;
  bool                 has_more = 2;
}

message SearchFilter {
  string id    = 1;
  string label = 2;
  // type:
  //   "select"      one option id, sent as filters[id] = "<optId>"
  //   "multiselect" zero+ option ids, sent comma-joined: filters[id] = "a,b,c"
  //   "range"       numeric interval; `options` carries {id:"min"|"max"|"step"}
  //                 bounds (step optional, default 1). Sent as
  //                 filters[id] = "<lo>..<hi>"; either side may be empty
  //                 ("2000..", "..2015"). Absent key = no constraint.
  //   "bool"        filters[id] = "true" | "false"
  //   "number"      one integer, sent as filters[id] = "<n>"
  // (filters stays map<string,string> on the wire — see SearchRequest.)
  string type  = 3;
  repeated FilterOption options = 4;
}

message FilterOption {
  string id    = 1;
  string label = 2;
}

message SearchFiltersRequest  { string plugin_id = 1; }
message SearchFiltersResponse { repeated SearchFilter filters = 1; }

message SearchRequest {
  string plugin_id            = 1;
  string query                = 2;
  int32  page                 = 3;
  map<string, string> filters = 4;
}
message SearchResponse {
  repeated CatalogItem items    = 1;
  bool                 has_more = 2;
}

message DetailsRequest {
  string plugin_id = 1;
  string media_id  = 2;
}

// ─── Typed rich-metadata messages ─────────────────────────────────────────────
// Populated only by GetDetails, never by catalog/search/browse.

message MovieDetails {
  string          plot           = 1;
  int32           year           = 2;
  repeated string genres         = 3;
  string          runtime        = 4;   // "120 min"
  repeated string cast           = 5;
  repeated string directors      = 6;
  string          trailer_url    = 7;
  string          released       = 8;   // ISO 8601 date
  string          tagline        = 9;
  string          content_rating = 10;  // "PG-13", "R", ...
  string          poster_url     = 11;  // full-res (may differ from tile)
  string          fanart_url     = 12;
  string          logo_url       = 13;  // transparent wordmark PNG/SVG
}

message SeriesDetails {
  string          plot            = 1;
  int32           year            = 2;
  repeated string genres          = 3;
  string          status          = 4;  // "Ended"|"Continuing"|"FINISHED"|"RELEASING"
  string          content_rating  = 5;
  string          network         = 6;
  string          episode_runtime = 7;  // "24 min"
  repeated string cast            = 8;
  repeated string creators        = 9;  // showrunners / studios
  string          trailer_url     = 10;
  string          first_air_date  = 11; // ISO 8601
  string          poster_url      = 12;
  string          fanart_url      = 13;
  repeated SeasonInfo seasons     = 14;
  string          logo_url        = 15; // transparent wordmark PNG/SVG
}

message EpisodeDetails {
  string          plot           = 1;
  int32           year           = 2;
  string          thumbnail_url  = 3;
  string          air_date       = 4;
  int32           duration       = 5;   // minutes
  double          vote           = 6;
  int32           episode_number = 7;
  int32           season_number  = 8;
  string          show_id        = 9;
  repeated string guest_stars    = 10;
  repeated string directors      = 11;
}

message LiveDetails {
  string          channel_name   = 1;
  string          channel_logo   = 2;
  string          stream_start   = 3;  // ISO 8601 datetime, empty if 24/7
  string          stream_end     = 4;
  string          sport_category = 5;  // "football"|"basketball"|...
  repeated string teams          = 6;
  string          competition    = 7;  // "Champions League", "Serie A", ...
  bool            is_replay      = 8;
}

message VideoDetails {
  string          channel_name = 1;
  string          channel_url  = 2;
  string          published_at = 3;  // ISO 8601 datetime
  int64           view_count   = 4;
  int64           like_count   = 5;
  string          duration     = 6;  // "PT12M30S" or "12:30"
  repeated string tags         = 7;
}

message MusicDetails {
  string          artist        = 1;
  string          album         = 2;
  string          album_art_url = 3;
  string          duration      = 4;  // "3:45"
  int32           track_number  = 5;
  int32           disc_number   = 6;
  string          released      = 7;  // ISO 8601 date
  repeated string composers     = 8;
  repeated string genres        = 9;
  string          lyrics_url    = 10;
}

message PodcastDetails {
  string          show_name      = 1;
  string          author         = 2;
  string          published_at   = 3;  // ISO 8601 datetime
  string          duration       = 4;  // "45:12"
  int32           episode_number = 5;
  int32           season_number  = 6;
  string          audio_url      = 7;
  repeated string tags           = 8;
}

message DetailsResponse {
  CatalogItem item = 1;
  // seasons removed from top-level — now inside SeriesDetails.seasons
  oneof details {
    MovieDetails   movie   = 2;
    SeriesDetails  series  = 3;
    EpisodeDetails episode = 4;
    LiveDetails    live    = 5;
    VideoDetails   video   = 6;
    MusicDetails   music   = 7;
    PodcastDetails podcast = 8;
  }
}

message BrowseRequest {
  string plugin_id = 1;
  string parent_id = 2;
  string child_id  = 3;
  int32  page      = 4;
}
message BrowseResponse {
  repeated CatalogItem  items    = 1;  // generic catalog/directory items
  bool                  has_more = 2;
  repeated EpisodeInfo  episodes = 3;  // populated when browsing a season
}

message StreamSource {
  string id      = 1;
  string label   = 2;
  string quality = 3;
  bool   is_live = 4;
}
message StreamsRequest {
  string plugin_id = 1;
  string media_id  = 2;
}
message StreamsResponse {
  repeated StreamSource sources = 1;
}

message ResolveRequest {
  string plugin_id = 1;
  string stream_id = 2;
  // Where playback will start (seconds), e.g. the Continue Watching resume
  // point; 0 = from the beginning. The server warms the segments around that
  // point instead of the first ones, so a resumed video starts from cache.
  // The client still opens the player at that position itself.
  double start_position_sec = 3;
  // A profile plays on one device at a time. When it's already playing on
  // another device ResolveStream fails with ABORTED ("in riproduzione su
  // «TV salotto»…"): the client can ask "watch here?" and resolve again with
  // take_over = true — playback moves to this device and the other one is
  // told (its next /proxy fetch answers 409, its next UpdateProgress
  // returns playback_elsewhere).
  bool take_over = 4;
}
message ResolveResponse {
  string              resolved_url = 1;
  map<string, string> http_headers = 2;
  bool                is_live      = 3;
  reserved 4;
  reserved "error";
  map<string, string> extra        = 5;
}

// ResolveProgress is an informational update emitted while ResolveStream is
// still working (e.g. a resolve stage failed but the plugin is falling back
// to another source). It never ends the RPC by itself.
message ResolveProgress {
  string message = 1;
  string status  = 2;
}

// ResolveStreamEvent is the payload of the ResolveStream server-streaming
// RPC: zero or more {progress} updates followed by exactly one {result}
// that ends the stream. If the resolve fails outright the RPC returns an
// error instead of a {result} event.
message ResolveStreamEvent {
  oneof payload {
    ResolveProgress progress = 1;
    ResolveResponse result   = 2;
  }
}

message ProgressRequest {
  string plugin_id          = 1;
  string media_id           = 2;
  string parent_id          = 3;
  int64  current_position   = 4;
  int64  total_duration     = 5;
  // navigation_context/title/poster: populate the continue-watching card.
  // Empty string leaves the existing stored value untouched (see
  // UpsertProgress's merge-on-conflict) rather than clearing it — a plain
  // position-only heartbeat doesn't need to resend metadata every tick.
  string navigation_context = 6;
  string title              = 7;
  string poster             = 8;
  // rating/genres/plot/year: same merge-on-conflict rule as above — 0/empty
  // leaves the stored value untouched. Sourced from GetDetails at play time
  // (PlaybackArgs on the Flutter side), not re-fetched here server-side.
  double rating             = 9;
  repeated string genres    = 10;
  string plot               = 11;
  int32  year               = 12;
  // season_number/episode_number: same merge-on-conflict rule as above - 0
  // leaves the stored value untouched. 0 for a movie/non-episodic item (no
  // column ever gets a real value for those, so GetContinueWatching's 0
  // means "not an episode" unambiguously on the read side too).
  int32  season_number      = 13;
  int32  episode_number     = 14;
}
message ProgressResponse {
  bool ok = 1;
  // This device no longer holds the profile's playback: it was taken over
  // by playing_on (a device label). The player should stop and say so.
  bool   playback_elsewhere = 2;
  string playing_on         = 3;
}

// ReleasePlayback frees the calling device's hold on the active profile's
// playback right away — call it when the player closes, so switching to
// another device needs no waiting (otherwise the hold lapses by itself
// ~90 s after the last activity).
message ReleasePlaybackRequest {}
message ReleasePlaybackResponse {
  bool ok = 1;
}

message DeleteProgressRequest {
  string plugin_id = 1;
  string media_id  = 2;
}
message DeleteProgressResponse {
  bool ok = 1;
}

message ContinueWatchingItem {
  string plugin_id          = 1;
  string media_id           = 2;
  string parent_id          = 3;
  string navigation_context = 4;
  string title              = 5;
  string poster             = 6;
  double progress_time      = 7;
  double total_time         = 8;
  string last_updated       = 9;
  double rating             = 10;
  repeated string genres    = 11;
  string plot               = 12;
  int32  year               = 13;
  int32  season_number      = 14;
  int32  episode_number     = 15;
}
message ContinueWatchingRequest {
  int32  limit     = 1;  // 0 = server default
  string parent_id = 2;  // optional filter
  string plugin_id = 3;  // optional filter
}
message ContinueWatchingResponse {
  repeated ContinueWatchingItem items = 1;
}

message PluginListRequest {}
message PluginInfo {
  string          plugin_id      = 1;
  string          name           = 2;
  string          version        = 3;
  bool            is_ready       = 4;
  repeated string capabilities   = 5;
  repeated CatalogDef catalogs   = 6;
  // Runtime status set by the plugin itself via mycelium.context.set_plugin_status()
  string          status_label   = 7; // "ready"|"syncing"|"needs_config"|"error"
  string          status_detail  = 8; // human-readable detail, e.g. "Indicizzazione 1200/5000"
  // True when one or more required core-scoped settings are missing
  bool            needs_config   = 9;
  // True when the plugin actually answered a liveness check recently — NOT
  // the same as is_ready (which only means "configured", independent of
  // whether the process/connection currently responds). A gRPC plugin whose
  // process is alive but whose channel is broken, or a Lua plugin whose last
  // N task runs all errored, reports reachable=false here so the client can
  // surface a real "backend unreachable" signal instead of the user having
  // to infer it from a stale catalog or dig through logs.
  bool            reachable      = 10;
  // Unix timestamp (seconds) of the last time this plugin was confirmed
  // reachable. 0 if never. Lets the client show "last seen Xm ago" instead
  // of a bare boolean.
  int64           last_ok_unix   = 11;
}
message CatalogDef {
  string id                = 1;
  string name              = 2;
  string type              = 3;
  int32  cache_ttl_seconds = 4;
  // section_kind: row layout, orthogonal to content type.
  //   ""|"carousel" — horizontal scroll (today's default, always safe).
  //   "grid"        — tile grid. Reserved: no client renders it yet as of
  //                   this writing: treat as unset until a client opts in.
  // Forward-compat contract: a client that doesn't recognize a value here
  // must skip/ignore it gracefully (treat as unset), never crash or render
  // garbage — this field will grow new values over time without a proto bump.
  string section_kind      = 5;
  // style_hint: presentation weight within section_kind.
  //   ""         — default card size (today's behavior).
  //   "featured" — larger cards, visual emphasis.
  //   "compact"  — smaller/denser cards.
  // Same forward-compat contract as section_kind.
  string style_hint        = 6;
  // True when this catalog backs a task the plugin author marked as
  // user-triggerable (manifest.yaml task: live_refresh: true) — e.g. sport's
  // "Live Ora" behind refresh_matches. Lets the client show a manual
  // "aggiorna ora" action instead of waiting for the next cron tick.
  bool   live_refreshable  = 7;
  // card_layout: card aspect ratio for this catalog's row — deliberately
  // independent of `type`. Before this field existed, the only way to get
  // 16:9 cards was `type = "live"`, which also forces the live-TV row
  // styling (home_screen.dart's big centered fonts) and disables
  // continue-watching plugin-wide — wrong for e.g. a YouTube-style plugin
  // that wants landscape thumbnails for perfectly ordinary on-demand video
  // (`CatalogItem.media_type` stays whatever it already was — "video", not
  // "live" — and continues to drive live-vs-VOD *player* behavior on its
  // own, unaffected by this field).
  //   ""           — poster/vertical, 2:3 (today's default, unchanged).
  //   "landscape"  — wide/horizontal, 16:9.
  // Same forward-compat contract as section_kind: unrecognized values must
  // be treated as unset, never crash or render garbage.
  string card_layout       = 8;
  // disable_hero_background: when true, the home screen's full-bleed hero
  // background never shows this catalog's fanart/poster imagery — it always
  // falls back to the neutral/anonymous background (a flat dark fill, or a
  // themed gradient for sport) that already renders today whenever no image
  // is available. Content this is useful for tends to look bad or feels
  // over-personal blown up full-screen (a specific match's low-res team
  // logos, a random video's thumbnail) — better to stay anonymous than
  // adapt to whatever's focused. False (default) preserves today's behavior
  // unchanged for every catalog that doesn't set this.
  bool   disable_hero_background = 9;
}
message PluginListResponse {
  repeated PluginInfo plugins = 1;
}

// ─── PluginService — per-user plugin settings ────────────────────────────────
// Manages user-scoped settings (scope: user in manifest.yaml).
// Core-scoped settings are admin-only and never exposed here.

message PluginSettingField {
  string id           = 1;
  string label        = 2;
  // type: "string"|"password"|"number"|"bool"
  string type         = 3;
  bool   required     = 4;
  // current_value is empty for password fields; use is_set instead
  string current_value = 5;
  bool   is_set        = 6; // true when a password field has a stored value
}

message GetPluginSettingsRequest {
  string plugin_id  = 1;
  string profile_id = 2; // empty = use profile from JWT header
}
message GetPluginSettingsResponse {
  repeated PluginSettingField fields = 1;
}

message SavePluginSettingRequest {
  string plugin_id  = 1;
  string profile_id = 2;
  string key        = 3;
  string value      = 4; // empty string = delete/clear the setting
}
message SavePluginSettingResponse {
  bool ok = 1;
}

// TriggerRefresh asks the core to run a plugin's live_refresh-marked task(s)
// right now, instead of waiting for its cron schedule. Non-blocking on the
// core side: if a task for this plugin is already running, ok=false with an
// explanatory message rather than queueing or blocking the call.
message TriggerRefreshRequest {
  string plugin_id = 1;
}
message TriggerRefreshResponse {
  bool   ok      = 1;
  string message = 2;
}

service PluginService {
  // Returns user-scoped setting definitions + current values for a plugin.
  rpc GetPluginSettings (GetPluginSettingsRequest)  returns (GetPluginSettingsResponse);
  // Saves or clears a single user-scoped setting.
  rpc SavePluginSetting (SavePluginSettingRequest)  returns (SavePluginSettingResponse);
  // Manually triggers a plugin's live_refresh task(s) on demand.
  rpc TriggerRefresh (TriggerRefreshRequest) returns (TriggerRefreshResponse);
}

// ─── Downloads (offline) ─────────────────────────────────────────────────────
// The server prepares a download: it resolves the stream, fetches it with the
// plugin's own egress and muxes the chosen quality + audio/subtitle tracks
// into ONE file (Matroska, no re-encoding) under its data dir. Devices then
// fetch the finished file over plain HTTP (file_url: signed, Range/resume
// supported) and play it offline — or, on a TV, just play file_url from the
// server. Only plugins whose manifest opts in (download.enabled) and only
// HLS VOD streams are downloadable. Downloads belong to the calling profile
// (or device without a profile); PIN rules apply as for every other call.

message DownloadOptionsRequest {
  string plugin_id = 1;
  string stream_id = 2; // a source id from GetStreams
}
message DownloadVariant {
  string id                = 1; // opaque — pass back in CreateDownloadRequest.variant_id
  int32  width             = 2;
  int32  height            = 3;
  int64  bandwidth         = 4; // bits/s
  bool   bandwidth_is_peak = 5; // true: only the peak rate was declared, estimate is an upper bound
  string codecs            = 6;
  int64  estimated_bytes   = 7; // this variant alone (includes its muxed audio, if any)
  string label             = 8; // "1080p"
}
message DownloadTrack {
  string id              = 1; // opaque — pass back in audio_ids / subtitle_ids
  string language        = 2; // as declared by the source ("ita", "it", …), may be empty
  string name            = 3;
  bool   is_default      = 4;
  int64  estimated_bytes = 5; // audio: rough estimate; subtitles: 0
}
message DownloadOptionsResponse {
  bool   available           = 1;
  string unavailable_reason  = 2;  // shown as-is when !available
  double duration_sec        = 3;
  repeated DownloadVariant variants  = 4; // best first
  repeated DownloadTrack   audio     = 5; // separate audio renditions (empty: audio is inside the variant)
  repeated DownloadTrack   subtitles = 6;
  string plugin_note         = 7;  // fixed hint from the plugin manifest
  string plugin_notice       = 8;  // live hint from this resolve (e.g. "ora max 720p, di notte 1080p")
  string preferred_hours     = 9;  // "HH:MM-HH:MM" server-local, "" = none
  bool   quality_below_usual = 10; // best variant now is below the best this plugin served before
  int32  usual_max_height    = 11;
  int64  server_free_bytes   = 12; // space the server can still use (quota and disk margin applied)
  int64  bytes_per_sec       = 13; // server download speed measured on past downloads, 0 = unknown
  int32  retention_days      = 14; // server deletes the file this long after it's ready, 0 = never
  // Where preferred_hours comes from: "plugin" (manifest), "learned" (the
  // server noticed this source serves its best quality in those hours), or
  // "" when there is no suggestion.
  string preferred_hours_source = 15;
}

message CreateDownloadRequest {
  string plugin_id = 1;
  string stream_id = 2;
  string variant_id = 3;              // "" = best
  repeated string audio_ids    = 4;   // empty = the source's default audio
  repeated string subtitle_ids = 5;
  // Schedule: not_before (unix seconds, 0 = now) and/or wait for the
  // plugin's preferred_hours window.
  int64  not_before          = 6;
  bool   use_preferred_hours = 7;
  // Display metadata, so the download list works offline on its own.
  string media_id       = 8;
  string parent_id      = 9;
  string title          = 10;
  string series_title   = 11;
  string poster         = 12;
  int32  season_number  = 13;
  int32  episode_number = 14;
  // If the file comes out below the quality this source usually reaches,
  // try again in the recommended hours (up to 3 times) and replace it only
  // with a better one.
  bool   upgrade_if_better = 15;
}

// CreateDownloads queues several streams of one plugin with the same
// choices — e.g. a whole season. Ids are criteria (see CreateDownloadRequest),
// so the variant/audio/subtitle ids taken from one episode's options apply
// to every item. Each item still becomes its own download.
message CreateDownloadItem {
  string stream_id      = 1;
  string media_id       = 2;
  string parent_id      = 3;
  string title          = 4;
  string series_title   = 5;
  string poster         = 6;
  int32  season_number  = 7;
  int32  episode_number = 8;
}
message CreateDownloadsRequest {
  string plugin_id = 1;
  repeated CreateDownloadItem items = 2;
  string variant_id = 3;
  repeated string audio_ids    = 4;
  repeated string subtitle_ids = 5;
  int64  not_before          = 6;
  bool   use_preferred_hours = 7;
  bool   upgrade_if_better   = 8;
}
message CreateDownloadsResponse {
  repeated DownloadInfo downloads = 1;
  int64 estimated_total_bytes = 2;
}

message DownloadInfo {
  string download_id    = 1;
  string plugin_id      = 2;
  string stream_id      = 3;
  string media_id       = 4;
  string parent_id      = 5;
  string title          = 6;
  string series_title   = 7;
  string poster         = 8;
  int32  season_number  = 9;
  int32  episode_number = 10;
  // queued | scheduled | running | paused | completed | failed | canceled
  // (paused: waiting while someone is watching something, see the server's
  // "pause downloads while streaming" setting — it resumes by itself)
  string status          = 11;
  string error           = 12;
  double progress        = 13; // 0..1
  int64  estimated_bytes = 14;
  int64  file_bytes      = 15; // bytes written so far / final size
  string quality_label   = 16;
  repeated string audio_languages    = 17;
  repeated string subtitle_languages = 18;
  int64  created_at     = 19; // unix seconds
  int64  scheduled_for  = 20; // 0 = as soon as possible
  int64  completed_at   = 21;
  int64  expires_at     = 22; // 0 = kept until deleted
  string file_url       = 23; // when completed: signed URL, valid ~24 h (re-list to refresh)
  double duration_sec   = 24;
  string container      = 25; // "mkv"
  bool   upgrade_pending = 26; // will retry for a better quality in the recommended hours
  bool   shared          = 27; // the same file also serves another profile's download
  bool   fetched         = 28; // AckDownloadFetched was called for it
}

message ListDownloadsRequest {}
message ListDownloadsResponse {
  repeated DownloadInfo downloads = 1;
  int64 server_free_bytes = 2;
  int64 quota_bytes       = 3;
  int64 used_bytes        = 4;
}
message DownloadIdRequest {
  string download_id = 1;
}
message DownloadActionResponse {
  bool ok = 1;
}
// AckDownloadFetched: the device now has the whole file. With the server
// option "delete after the device fetched it" on, the server copy goes
// (unless another profile's download still uses it).

service MediaPipeline {
  rpc GetCatalog       (CatalogRequest)        returns (CatalogResponse);
  rpc GetSearchFilters (SearchFiltersRequest)  returns (SearchFiltersResponse);
  rpc Search           (SearchRequest)         returns (SearchResponse);
  rpc GetDetails    (DetailsRequest)    returns (DetailsResponse);
  rpc Browse        (BrowseRequest)     returns (BrowseResponse);
  rpc GetStreams     (StreamsRequest)    returns (StreamsResponse);
  rpc ResolveStream (ResolveRequest)    returns (stream ResolveStreamEvent);
  rpc UpdateProgress(ProgressRequest)         returns (ProgressResponse);
  rpc DeleteProgress(DeleteProgressRequest)   returns (DeleteProgressResponse);
  rpc GetContinueWatching(ContinueWatchingRequest) returns (ContinueWatchingResponse);
  rpc ListPlugins   (PluginListRequest) returns (PluginListResponse);
  rpc GetDownloadOptions (DownloadOptionsRequest) returns (DownloadOptionsResponse);
  rpc CreateDownload     (CreateDownloadRequest)  returns (DownloadInfo);
  rpc ListDownloads      (ListDownloadsRequest)   returns (ListDownloadsResponse);
  rpc CancelDownload     (DownloadIdRequest)      returns (DownloadActionResponse);
  rpc DeleteDownload     (DownloadIdRequest)      returns (DownloadActionResponse);
  rpc CreateDownloads    (CreateDownloadsRequest) returns (CreateDownloadsResponse);
  rpc AckDownloadFetched (DownloadIdRequest)      returns (DownloadActionResponse);
  rpc ReleasePlayback    (ReleasePlaybackRequest) returns (ReleasePlaybackResponse);
}
