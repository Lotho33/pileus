# Pre-merge gate: static analysis + unit tests on every push and PR to the
# main lines. Build coverage for the release artifacts lives in
# release.yml / store.yml / linux.yml / web.yml / windows.yml.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: what the devcontainer builds with. 3.50 needs Gradle 9.3 and
          # deprecates package:flutter/material.dart (analyze fails) — a migration
          # of its own, not something to pick up silently on a release tag.
          flutter-version: 3.47.1
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
