# Builds the Android APKs (both the `tv` and `mobile` flavors — distinct
# applicationIds, so Obtainium needs two separate app entries, one per
# flavor, each filtered to its own asset name pattern) AND the web/PWA
# bundle on every `vX.Y.Z` tag, and attaches them to the matching GitHub
# Release — this is the Obtainium / sideload beta channel (see RELEASE.md);
# the in-app update check stays wired in for Android
# (--dart-define=PILEUS_GITHUB_REPO). The Play/Amazon *store* artifacts
# (signed AAB, no update check) are a separate, manually-run pipeline
# (store.yml). Linux/Windows bundles are separate manual conveniences too
# (linux.yml / windows.yml) — unlike web, not every release needs a fresh
# desktop bundle re-deployed.
#
# GitHub-hosted runner, standard actions — no self-hosted runner or custom
# registry secret needed. GITHUB_TOKEN (builtin, `contents: write` below)
# covers release creation + asset upload.
#
# Needs: repo secrets
#   ANDROID_KEYSTORE_BASE64   base64 -w0 android/app/release.jks
#   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
# and, optionally, repo variable PILEUS_MYCELIUM_HOST (baked in via
# --dart-define for TVs where `mycelium.local` won't resolve). The web job
# needs none of the above — no signing, no native toolchain.
#
# A fourth job, amazon-submit, builds the TV flavor again with store.yml's
# own flags (NOT the sideload APKs the android job above produces — those
# keep the GitHub update-checker compiled in, which must never ship to
# Amazon) and uploads it to a new Amazon Appstore edit via the App
# Submission API — see scripts/amazon-upload-edit.sh for the actual calls
# and why it deliberately stops short of submitting that edit for review.
# Needs repo secrets AMAZON_CLIENT_ID / AMAZON_CLIENT_SECRET
# (scripts/set-amazon-secrets.sh) and repo variable AMAZON_APP_ID; runs
# independently of the other two jobs (no shared GitHub Release to race)
# and is best-effort — a failure here never blocks the sideload release.
#
# Store jobs only run for targets this tag actually changed (job `targets`,
# scripts/release-targets.py — Dart import closure per entry point since the
# previous tag; workflow_dispatch's `force` input overrides):
#   tv     -> amazon-submit (submitted for review) + play (Android TV app,
#             track = repo variable PLAY_TRACK, default alpha)
#   mobile -> play (mobile app)
#   webos  -> webos: both .ipk attached to the GitHub Release; LG's Seller
#             Lounge has no upload API, so that upload stays manual.
# play needs secret PLAY_SERVICE_ACCOUNT_JSON (RELEASE.md); without it the
# job warns and skips instead of failing.
#
# versionCode = scripts/version-code.sh <version> in every job (not the run
# number, which differs per workflow and per store).

name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)build, e.g. v1.4.0"
        required: true
      force:
        description: "store targets to publish even if unchanged: comma list of tv,mobile,webos or 'all'"
        required: false
        default: ""

permissions:
  contents: write # create the GitHub Release

jobs:
  # Which store targets this tag changed — see the header and
  # scripts/release-targets.py. Gates amazon-submit / play / webos.
  targets:
    runs-on: ubuntu-latest
    outputs:
      tv: ${{ steps.t.outputs.tv }}
      mobile: ${{ steps.t.outputs.mobile }}
      webos: ${{ steps.t.outputs.webos }}
      play_matrix: ${{ steps.t.outputs.play_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0 # previous tags, for the diff

      - id: t
        run: |
          python3 scripts/release-targets.py --github-output \
            --head "${{ github.event.inputs.tag || github.ref_name }}" \
            --force "${{ github.event.inputs.force }}"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Derive version
        id: v
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "name=${ref#v}" >> "$GITHUB_OUTPUT"
          # Older tags predate the script: keep their run-number versionCode.
          if [ -x scripts/version-code.sh ]; then
            echo "build=$(scripts/version-code.sh "${ref#v}")" >> "$GITHUB_OUTPUT"
          else
            echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter pub get

      # ── Android signing ────────────────────────────────────────────────
      - name: Android signing config
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu

          # ── safe diagnostics: presence + length only, never the value ──
          present() { [ -n "${1:-}" ] && echo "set (${#1} chars)" || echo "MISSING"; }
          echo "ANDROID_KEYSTORE_BASE64  : $(present "${KS_B64:-}")"
          echo "ANDROID_KEYSTORE_PASSWORD: $([ -n "${KS_PASS:-}" ] && echo set || echo MISSING)"
          echo "ANDROID_KEY_ALIAS        : ${KEY_ALIAS:-<MISSING>}"
          echo "ANDROID_KEY_PASSWORD     : $([ -n "${KEY_PASS:-}" ] && echo set || echo MISSING)"

          if [ -z "${KS_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 not set — refusing to publish a debug-signed APK."
            echo "Set the signing secrets (see RELEASE.md) and re-run the tag."
            exit 1
          fi

          if ! echo "$KS_B64" | base64 -d > android/app/release.jks; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 — regenerate with 'base64 -w0 android/app/release.jks'"
            exit 1
          fi
          echo "release.jks: $(wc -c < android/app/release.jks) bytes"
          # Fail here with a clear message instead of a cryptic
          # ':app:packageRelease > KeytoolException ... : null' five minutes in.
          if ! keytool -list -keystore android/app/release.jks -storepass "$KS_PASS" >/dev/null 2>&1; then
            echo "::error::release.jks unreadable — check ANDROID_KEYSTORE_BASE64 (truncated? wrong file?) and ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          if ! keytool -list -keystore android/app/release.jks -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::alias '$KEY_ALIAS' not in keystore — check ANDROID_KEY_ALIAS (case-sensitive)"
            exit 1
          fi
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties
          echo "Signing: RELEASE  (alias=$KEY_ALIAS)"

      - name: Build APKs (tv)
        run: |
          # Drop the unused libmpv.so (~12 MB/ABI — Android always uses
          # ExoPlayer) and turn on R8 code+resource shrink. This beta channel
          # is where an R8 mis-strip should surface — before a store
          # submission, not after.
          flutter build apk --release --flavor tv --split-per-abi \
            --target-platform android-arm,android-arm64 \
            -PpileusExcludeMpv=true -PpileusR8=true \
            --obfuscate --split-debug-info=build/symbols-tv \
            --build-name="${{ steps.v.outputs.name }}" \
            --build-number="${{ steps.v.outputs.build }}" \
            --dart-define=PILEUS_GITHUB_REPO="${{ github.repository }}" \
            --dart-define=PILEUS_MYCELIUM_HOST="${{ vars.PILEUS_MYCELIUM_HOST }}"
          mkdir -p dist
          # flutter names split-per-abi flavored APKs app-<abi>-<flavor>-release.apk
          # (abi first), e.g. app-arm64-v8a-tv-release.apk. Naming kept
          # without "-tv-" for backwards compat with existing Obtainium
          # filename filters (this asset name predates the mobile build).
          for f in build/app/outputs/flutter-apk/app-*-tv-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.+)-tv-release\.apk$/\1/')
            cp "$f" "dist/pileus-${{ steps.v.outputs.name }}-android-${abi}.apk"
          done
          # Obfuscation symbols — needed to de-obfuscate any crash/ANR stack
          # trace from a build produced by this pipeline. Keep them.
          tar czf "dist/pileus-${{ steps.v.outputs.name }}-android-symbols.tar.gz" \
            -C build/symbols-tv . || true

      - name: Build APKs (mobile)
        run: |
          # Same size cuts as tv. Distinct applicationId
          # (com.lotho33.pileus.mobile) — Obtainium needs a second app entry
          # for this one, filtered on the "-mobile-" asset name below.
          flutter build apk --release --flavor mobile -t lib/main_mobile.dart \
            --split-per-abi --target-platform android-arm,android-arm64 \
            -PpileusExcludeMpv=true -PpileusR8=true \
            --obfuscate --split-debug-info=build/symbols-mobile \
            --build-name="${{ steps.v.outputs.name }}" \
            --build-number="${{ steps.v.outputs.build }}" \
            --dart-define=PILEUS_GITHUB_REPO="${{ github.repository }}" \
            --dart-define=PILEUS_MYCELIUM_HOST="${{ vars.PILEUS_MYCELIUM_HOST }}"
          for f in build/app/outputs/flutter-apk/app-*-mobile-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.+)-mobile-release\.apk$/\1/')
            cp "$f" "dist/pileus-${{ steps.v.outputs.name }}-mobile-android-${abi}.apk"
          done
          tar czf "dist/pileus-${{ steps.v.outputs.name }}-mobile-android-symbols.tar.gz" \
            -C build/symbols-mobile . || true

      - name: Checksums
        run: ( cd dist && sha256sum * > SHA256SUMS.txt )

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*

  # Runs after `android` so the release already exists by the time this
  # uploads to it (two parallel jobs both creating the same release via
  # action-gh-release would race). The bundle expects to be served from the
  # same origin as Mycelium — see docs/WEB.md for what that still needs on
  # the server side before playback works end to end; this job only
  # produces and publishes the static files.
  web:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Derive version
        id: v
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "name=${ref#v}" >> "$GITHUB_OUTPUT"
          # Older tags predate the script: keep their run-number versionCode.
          if [ -x scripts/version-code.sh ]; then
            echo "build=$(scripts/version-code.sh "${ref#v}")" >> "$GITHUB_OUTPUT"
          else
            echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter pub get

      - name: Build web bundle
        run: |
          set -eu
          V="${{ steps.v.outputs.name }}"
          # PILEUS_STORE_BUILD=true: same reasoning as the store Android
          # builds — a web/PWA install is always "latest" from the origin
          # it's served from, so the sideload update-check/dialog (which
          # points at GitHub releases) doesn't apply here.
          flutter build web --release -t lib/main_web.dart --base-href / \
            --build-name="$V" --build-number="${{ steps.v.outputs.build }}" \
            --dart-define=PILEUS_STORE_BUILD=true
          mkdir -p dist
          tar czf "dist/pileus-$V-web.tar.gz" -C build/web .
          ( cd dist && sha256sum * > SHA256SUMS-web.txt )

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*

  # Draft-uploads the TV store build to Amazon on every tag — see the file
  # header above and scripts/amazon-upload-edit.sh. Independent of
  # `android`/`web`: it touches no GitHub Release, so there's nothing to
  # race, and a problem here (a missing/expired Amazon credential, an API
  # change) shouldn't hold up the sideload release those two jobs publish.
  # continue-on-error at the job level would hide a real failure from the
  # Actions UI entirely (green check regardless) — this is left to fail
  # loud instead, same as every other job here, since "Amazon upload
  # silently didn't happen" is exactly the failure mode worth noticing.
  amazon-submit:
    needs: targets
    if: needs.targets.outputs.tv == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Derive version
        id: v
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "name=${ref#v}" >> "$GITHUB_OUTPUT"
          # Older tags predate the script: keep their run-number versionCode.
          if [ -x scripts/version-code.sh ]; then
            echo "build=$(scripts/version-code.sh "${ref#v}")" >> "$GITHUB_OUTPUT"
          else
            echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter pub get

      - name: Android signing config (mandatory — same secrets as store.yml)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KS_B64:-}" ] || [ -z "${KS_PASS:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASS:-}" ]; then
            echo "::error::amazon-submit requires the same ANDROID_KEYSTORE_* secrets as store.yml — refusing to upload a debug-signed APK to Amazon."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > android/app/release.jks
          keytool -list -keystore android/app/release.jks -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties

      # armeabi-v7a only: the Amazon Appstore build targets Fire TV, which
      # only takes the 32-bit APK — an arm64 one is useless there.
      - name: Build TV (store-ready, armv7 — keep in sync with store.yml's own "Build TV" step)
        run: |
          set -eu
          V="${{ steps.v.outputs.name }}"
          flutter build apk --release --flavor tv --split-per-abi \
            --target-platform android-arm \
            -PpileusRequireSigning=true -PpileusExcludeMpv=true -PpileusR8=true \
            --obfuscate --split-debug-info=build/symbols-tv \
            --dart-define=PILEUS_STORE_BUILD=true \
            --build-name="$V" --build-number="${{ steps.v.outputs.build }}"
          mkdir -p amazon-apks
          cp build/app/outputs/flutter-apk/app-*-tv-release.apk amazon-apks/
          ls -la amazon-apks

      - name: Upload to Amazon Appstore and submit for review
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_APP_ID: ${{ vars.AMAZON_APP_ID }}
          AMAZON_RELEASE_VERSION: ${{ steps.v.outputs.name }}
        run: |
          set -eu
          if [ -z "${AMAZON_CLIENT_ID:-}" ] || [ -z "${AMAZON_CLIENT_SECRET:-}" ] || [ -z "${AMAZON_APP_ID:-}" ]; then
            echo "::error::set secrets AMAZON_CLIENT_ID / AMAZON_CLIENT_SECRET (scripts/set-amazon-secrets.sh) and repo variable AMAZON_APP_ID first."
            exit 1
          fi
          scripts/amazon-upload-edit.sh --submit amazon-apks/*.apk

  # Play Store: the Android TV app (tv flavor) and the mobile app are two
  # listings; each is built and sent to the PLAY_TRACK track (default
  # alpha; submitted for review) only when its target changed. Flags: keep in sync with
  # store.yml.
  play:
    needs: targets
    if: needs.targets.outputs.play_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.targets.outputs.play_matrix) }}
    steps:
      - name: Service account present?
        id: sa
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${SA:-}" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON not set — ${{ matrix.flavor }} NOT uploaded to Play (see RELEASE.md, Play API). Re-run this tag with force=${{ matrix.flavor }} once it is."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.sa.outputs.ok == 'true'
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: subosito/flutter-action@v2
        if: steps.sa.outputs.ok == 'true'
        with:
          channel: stable
          cache: true

      - name: Derive version
        if: steps.sa.outputs.ok == 'true'
        id: v
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "name=${ref#v}" >> "$GITHUB_OUTPUT"
          echo "build=$(scripts/version-code.sh "${ref#v}")" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.flavor }}" = tv ]; then
            echo "package=com.lotho33.pileus" >> "$GITHUB_OUTPUT"
            echo "target=lib/main.dart" >> "$GITHUB_OUTPUT"
          else
            echo "package=com.lotho33.pileus.mobile" >> "$GITHUB_OUTPUT"
            echo "target=lib/main_mobile.dart" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.sa.outputs.ok == 'true'
        run: flutter pub get

      - name: Android signing config (mandatory — same secrets as store.yml)
        if: steps.sa.outputs.ok == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KS_B64:-}" ] || [ -z "${KS_PASS:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASS:-}" ]; then
            echo "::error::play requires the same ANDROID_KEYSTORE_* secrets as store.yml — refusing to upload a debug-signed bundle."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > android/app/release.jks
          keytool -list -keystore android/app/release.jks -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties

      - name: Build AAB (${{ matrix.flavor }})
        if: steps.sa.outputs.ok == 'true'
        run: |
          set -eu
          flutter build appbundle --release --flavor "${{ matrix.flavor }}" \
            -t "${{ steps.v.outputs.target }}" \
            -PpileusRequireSigning=true -PpileusExcludeMpv=true -PpileusR8=true \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=PILEUS_STORE_BUILD=true \
            --build-name="${{ steps.v.outputs.name }}" \
            --build-number="${{ steps.v.outputs.build }}"

      # Track: repo variable PLAY_TRACK, default alpha (closed testing) —
      # the apps have no production access yet (1.6.6 sits in alpha +
      # internal). Set PLAY_TRACK=production once Google grants it.
      - name: Upload to Play (${{ vars.PLAY_TRACK || 'alpha' }} track, submitted for review)
        if: steps.sa.outputs.ok == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.v.outputs.package }}
          releaseFiles: build/app/outputs/bundle/${{ matrix.flavor }}Release/app-${{ matrix.flavor }}-release.aab
          releaseName: ${{ steps.v.outputs.name }}
          track: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: completed
          mappingFile: build/app/outputs/mapping/${{ matrix.flavor }}Release/mapping.txt

  # LG webOS: both resolution packages (1080p + 720p, see
  # scripts/build-webos.sh) attached to the GitHub Release. LG's Seller
  # Lounge has no upload API, so uploading them there stays manual. After
  # `android` so the release already exists (same reason as `web`).
  webos:
    needs: [targets, android]
    if: needs.targets.outputs.webos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g @webos-tools/cli@3.2.6

      - name: Build .ipk (1080p + 720p)
        run: |
          set -eu
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          V="${ref#v}"
          flutter pub get
          PILEUS_BUILD_NUMBER="$(scripts/version-code.sh "$V")"
          export PILEUS_BUILD_NUMBER
          scripts/build-webos.sh
          scripts/build-webos.sh --720p
          mkdir -p dist
          cp build/webos/*.ipk "dist/pileus-$V-webos-1080p.ipk"
          cp build/webos-720p/*.ipk "dist/pileus-$V-webos-720p.ipk"
          ( cd dist && sha256sum * > SHA256SUMS-webos.txt )

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
