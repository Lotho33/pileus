name: Feature request
description: Suggest an improvement to the Pileus client
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Pileus is a bring-your-own-server client; the supported backends are
        Jellyfin and Plex via Mycelium. Requests to target other specific
        content sources are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Pileus makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Which target(s)
      multiple: true
      options:
        - Android TV / Fire TV
        - Mobile
        - Desktop
        - Web
        - All / shared
    validations:
      required: true
